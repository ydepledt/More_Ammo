[mod-setting-name]
more-ammo-require-empty-magazines=Exiger des chargeurs et douilles vides

[mod-setting-description]
more-ammo-require-empty-magazines=Si cette option est décochée, les recettes de More Ammo utilisent directement les matériaux nécessaires à la fabrication des chargeurs et douilles vides. Inclut les chargeurs à grande capacité, les cartouches compressées et les chargeurs avancés de Space Exploration. Le coût en ressources et les multiplicateurs de coût des contenants sont conservés. Activé par défaut. Nécessite un redémarrage.
